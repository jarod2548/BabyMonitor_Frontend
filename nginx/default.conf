server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve frontend
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests, but don’t fail if backend is down
    location /api/ {
        # Use Docker DNS resolver for Compose network
        resolver 127.0.0.11 valid=10s;

        # Pass requests to backend service (replace with your backend service name)
        set $backend "Baby_Monitor_Backend:8080";

        proxy_pass http://$backend;

        # Optional: if backend is down, return 502 but frontend still works
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        proxy_next_upstream error timeout invalid_header http_502;
    }
}